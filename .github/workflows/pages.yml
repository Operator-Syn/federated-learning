name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate presentation HTML
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          page = Path("presentation/index.html")
          if not page.is_file():
              raise SystemExit("presentation/index.html is missing")

          class PresentationCheck(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.slides = 0
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag == "section" and "slide" in dict(attrs).get("class", "").split():
                      self.slides += 1
              def handle_data(self, data):
                  self.text.append(data)

          check = PresentationCheck()
          check.feed(page.read_text(encoding="utf-8"))
          check.close()
          if check.slides != 8:
              raise SystemExit(f"Expected 8 slides, found {check.slides}")
          text = " ".join(" ".join(check.text).split())
          expected = "Federated Learning for Collaborative Healthcare AI Without Moving Patient Records."
          if expected not in text:
              raise SystemExit("Expected cover subtitle is missing")
          if "Federated Learning for Collaborative Healthcare AI Using NVIDIA FLARE" in text:
              raise SystemExit("Cover must not pin a federated-learning platform")
          print("Presentation structure and cover copy validated.")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentation

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
